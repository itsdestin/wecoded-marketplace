name: Deploy Marketplace Worker

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "npm", cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations
        run: npx wrangler d1 migrations apply marketplace --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Deploy MUST run before Push secrets: `wrangler deploy` reconciles the
      # Worker's bindings to match wrangler.toml, removing any stale vars left
      # from earlier deploys. Pushing a secret with the same name as a stale
      # var errors with "Binding name already in use". Deploy first clears
      # the slate; then secrets stick cleanly.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Push secrets
        run: |
          echo "${{ secrets.MARKETPLACE_GH_CLIENT_ID }}" | npx wrangler secret put GH_CLIENT_ID
          echo "${{ secrets.MARKETPLACE_GH_CLIENT_SECRET }}" | npx wrangler secret put GH_CLIENT_SECRET
          echo "${{ secrets.MARKETPLACE_ADMIN_USER_IDS }}" | npx wrangler secret put ADMIN_USER_IDS
          # Analytics Engine SQL-API credentials used by admin /admin/analytics/*
          # routes. CF_ANALYTICS_TOKEN is a narrow Analytics-Engine-Read scoped
          # token distinct from the broader CF_API_TOKEN used for deploy above.
          echo "${{ secrets.CF_ACCOUNT_ID }}" | npx wrangler secret put CF_ACCOUNT_ID
          echo "${{ secrets.MARKETPLACE_CF_ANALYTICS_TOKEN }}" | npx wrangler secret put CF_ANALYTICS_TOKEN
          # Shared secret the hourly catalog-ingest Action presents on
          # POST /admin/catalog/*. Repo secret MARKETPLACE_CATALOG_INGEST_TOKEN
          # must exist before this runs — `wrangler secret put` fails on empty input.
          echo "${{ secrets.MARKETPLACE_CATALOG_INGEST_TOKEN }}" | npx wrangler secret put CATALOG_INGEST_TOKEN
          # Comma-separated device hashes of Destin's own devices, excluded from
          # /admin/analytics/* unless ?include_admins=1. WHY this line exists: the
          # filter shipped with only a test value in wrangler.toml and nothing
          # pushed it to production, so admin counts silently included his devices.
          # Repo secret MARKETPLACE_KNOWN_DEV_DEVICES must exist before this runs.
          # Compute a device's hash with youcoded-admin skills/analytics/scripts/device-hash.mjs.
          echo "${{ secrets.MARKETPLACE_KNOWN_DEV_DEVICES }}" | npx wrangler secret put KNOWN_DEV_DEVICES
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # WHY: page capabilities must be signed with a secret, never a public [vars] value.
      - name: Push website analytics signing secret
        run: |
          test -n "$SITE_ANALYTICS_SECRET"
          printf '%s' "$SITE_ANALYTICS_SECRET" | npx wrangler secret put SITE_ANALYTICS_SECRET
        env:
          SITE_ANALYTICS_SECRET: ${{ secrets.MARKETPLACE_SITE_ANALYTICS_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
